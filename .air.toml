root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/hmachronos-api ."
  bin = "./tmp/hmachronos-api"
  include_ext = ["go", "html", "tmpl", "tpl", "json", "yaml", "yml"]
  exclude_dir = ["tmp", "vendor", "data", ".git"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true